aid: runware
name: Runware
description: >-
  Runware is a unified AI inference platform — "one API for all AI" — that gives
  developers a single endpoint for image, video, audio, 3D, and text (LLM)
  generation across 400K+ open and closed-source models. Every request is a
  task object (taskType, taskUUID, model identifier, and modality parameters)
  posted to a single HTTP endpoint, with WebSocket and Server-Sent Events
  transports for low-latency and streaming workloads. Models are addressed by a
  creator:family@version identifier and billed pay-per-request with no
  subscriptions — serverless open models bill on optimized compute time while
  closed partner models use fixed per-request rates. Runware ships official
  TypeScript and Python SDKs, a static-binary CLI, a hosted Model Context
  Protocol (MCP) server, published Agent Skills, a Vercel AI SDK provider, and
  an OpenAI-compatibility layer, so the same inference surface is reachable from
  code, terminal, and agents.
