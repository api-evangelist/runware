standard: Agent Skills (open standard, SKILL.md folders)
description: >-
  Runware publishes first-party Agent Skills following the open Agent Skills
  standard — each is a folder with a SKILL.md file whose frontmatter name +
  description trigger agent matching. Skills operate through existing Runware
  access (SDK / MCP / CLI); there is no new endpoint to host. Installable in
  Claude Code, Claude.ai, Cursor (.cursor/skills/), OpenClaw, or any agent
  (.agents/skills/).
install:
  claude_code: Register the Runware marketplace and install the skills plugin.
  claude_ai: Customize -> Skills -> upload the skill folder.
  cursor: Copy folders into .cursor/skills/
  any_agent: Drop folders in .agents/skills/ (or ~/.agents/skills/ globally)
